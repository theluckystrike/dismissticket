name: IndexNow Submission

on:
  push:
    branches: [main]
    paths:
      - 'california/**'
      - 'texas/**'
      - 'florida/**'
      - 'new-york/**'
      - 'georgia/**'
      - 'ohio/**'
      - 'virginia/**'
      - 'illinois/**'
      - 'pennsylvania/**'
      - 'north-carolina/**'
      - 'tools/**'
      - 'index.md'
      - 'traffic-school.md'
      - 'speeding-ticket-insurance.md'
      - 'how-to-fight-a-speeding-ticket.md'
      - 'red-light-ticket.md'
      - 'points-on-license.md'
      - 'reckless-driving.md'
      - 'about.md'
      - 'privacy-policy.md'
  workflow_dispatch:
    inputs:
      submit_all:
        description: 'Submit all URLs (not just changed ones)'
        required: false
        default: false
        type: boolean

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event.inputs.submit_all == 'true' && 0 || 2 }}

      - name: Collect changed URLs
        id: collect
        run: |
          SITE="https://dismissticket.com"
          URL_FILE=$(mktemp)

          if [[ "${{ github.event.inputs.submit_all }}" == "true" ]]; then
            echo "Mode: submitting ALL URLs"
            echo "${SITE}/" >> "$URL_FILE"
            echo "${SITE}/traffic-school/" >> "$URL_FILE"
            echo "${SITE}/speeding-ticket-insurance/" >> "$URL_FILE"
            echo "${SITE}/how-to-fight-a-speeding-ticket/" >> "$URL_FILE"
            echo "${SITE}/red-light-ticket/" >> "$URL_FILE"
            echo "${SITE}/points-on-license/" >> "$URL_FILE"
            echo "${SITE}/reckless-driving/" >> "$URL_FILE"
            echo "${SITE}/about/" >> "$URL_FILE"
            echo "${SITE}/privacy-policy/" >> "$URL_FILE"

            for state_dir in california texas florida new-york georgia ohio virginia illinois pennsylvania north-carolina; do
              if [[ -d "$state_dir" ]]; then
                echo "${SITE}/${state_dir}/" >> "$URL_FILE"
                for f in "${state_dir}"/*.md; do
                  [[ -f "$f" ]] || continue
                  slug=$(basename "$f" .md)
                  [[ "$slug" == "index" ]] && continue
                  echo "${SITE}/${state_dir}/${slug}/" >> "$URL_FILE"
                done
              fi
            done

            for f in tools/*.md; do
              [[ -f "$f" ]] || continue
              slug=$(basename "$f" .md)
              echo "${SITE}/tools/${slug}/" >> "$URL_FILE"
            done
          else
            echo "Mode: submitting changed URLs only"

            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD)
            else
              CHANGED=$(git ls-tree -r --name-only HEAD)
            fi

            echo "Changed files:"
            echo "$CHANGED"

            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                california/index.md)   echo "${SITE}/california/" >> "$URL_FILE" ;;
                texas/index.md)        echo "${SITE}/texas/" >> "$URL_FILE" ;;
                florida/index.md)      echo "${SITE}/florida/" >> "$URL_FILE" ;;
                new-york/index.md)     echo "${SITE}/new-york/" >> "$URL_FILE" ;;
                georgia/index.md)      echo "${SITE}/georgia/" >> "$URL_FILE" ;;
                ohio/index.md)         echo "${SITE}/ohio/" >> "$URL_FILE" ;;
                virginia/index.md)     echo "${SITE}/virginia/" >> "$URL_FILE" ;;
                illinois/index.md)     echo "${SITE}/illinois/" >> "$URL_FILE" ;;
                pennsylvania/index.md) echo "${SITE}/pennsylvania/" >> "$URL_FILE" ;;
                north-carolina/index.md) echo "${SITE}/north-carolina/" >> "$URL_FILE" ;;
                california/*.md)       slug=$(basename "$file" .md); echo "${SITE}/california/${slug}/" >> "$URL_FILE" ;;
                texas/*.md)            slug=$(basename "$file" .md); echo "${SITE}/texas/${slug}/" >> "$URL_FILE" ;;
                florida/*.md)          slug=$(basename "$file" .md); echo "${SITE}/florida/${slug}/" >> "$URL_FILE" ;;
                new-york/*.md)         slug=$(basename "$file" .md); echo "${SITE}/new-york/${slug}/" >> "$URL_FILE" ;;
                georgia/*.md)          slug=$(basename "$file" .md); echo "${SITE}/georgia/${slug}/" >> "$URL_FILE" ;;
                ohio/*.md)             slug=$(basename "$file" .md); echo "${SITE}/ohio/${slug}/" >> "$URL_FILE" ;;
                virginia/*.md)         slug=$(basename "$file" .md); echo "${SITE}/virginia/${slug}/" >> "$URL_FILE" ;;
                illinois/*.md)         slug=$(basename "$file" .md); echo "${SITE}/illinois/${slug}/" >> "$URL_FILE" ;;
                pennsylvania/*.md)     slug=$(basename "$file" .md); echo "${SITE}/pennsylvania/${slug}/" >> "$URL_FILE" ;;
                north-carolina/*.md)   slug=$(basename "$file" .md); echo "${SITE}/north-carolina/${slug}/" >> "$URL_FILE" ;;
                tools/*.md)            slug=$(basename "$file" .md); echo "${SITE}/tools/${slug}/" >> "$URL_FILE" ;;
                index.md)              echo "${SITE}/" >> "$URL_FILE" ;;
                traffic-school.md)     echo "${SITE}/traffic-school/" >> "$URL_FILE" ;;
                speeding-ticket-insurance.md)  echo "${SITE}/speeding-ticket-insurance/" >> "$URL_FILE" ;;
                how-to-fight-a-speeding-ticket.md) echo "${SITE}/how-to-fight-a-speeding-ticket/" >> "$URL_FILE" ;;
                red-light-ticket.md)   echo "${SITE}/red-light-ticket/" >> "$URL_FILE" ;;
                points-on-license.md)  echo "${SITE}/points-on-license/" >> "$URL_FILE" ;;
                reckless-driving.md)   echo "${SITE}/reckless-driving/" >> "$URL_FILE" ;;
                about.md)              echo "${SITE}/about/" >> "$URL_FILE" ;;
                privacy-policy.md)     echo "${SITE}/privacy-policy/" >> "$URL_FILE" ;;
              esac
            done <<< "$CHANGED"
          fi

          sort -u "$URL_FILE" -o "$URL_FILE"
          COUNT=$(wc -l < "$URL_FILE" | tr -d ' ')
          echo "Collected ${COUNT} URLs"

          if [[ "$COUNT" -gt 0 ]]; then
            echo "URLs to submit:"
            cat "$URL_FILE"
          fi

          cp "$URL_FILE" /tmp/indexnow_urls.txt
          echo "url_file=/tmp/indexnow_urls.txt" >> "$GITHUB_OUTPUT"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Submit to IndexNow
        if: steps.collect.outputs.count != '0'
        env:
          INDEXNOW_KEY: c4ded4558ba249bbbd828bbfd67ebe80
        run: |
          URL_FILE="/tmp/indexnow_urls.txt"
          TOTAL=${{ steps.collect.outputs.count }}

          PAYLOAD=$(jq -R -s \
            --arg host "dismissticket.com" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyloc "https://dismissticket.com/${INDEXNOW_KEY}.txt" \
            '{
              host: $host,
              key: $key,
              keyLocation: $keyloc,
              urlList: (split("\n") | map(select(length > 0)))
            }' "$URL_FILE")

          HTTP_CODE=$(curl -s -o /tmp/indexnow_response.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD" \
            --max-time 30)

          echo "Submitted $TOTAL URLs to IndexNow (HTTP $HTTP_CODE)"

      - name: No URLs to submit
        if: steps.collect.outputs.count == '0'
        run: echo "No URLs changed. Skipping IndexNow submission."
