title: "DismissTicket"
tagline: "How to Dismiss Your Traffic Ticket — State-by-State Guides & Free Tools"
description: "Free state-by-state guides to dismiss traffic tickets. Traffic school options, court procedures, cost calculators, and decision tools for every US state."
url: "https://dismissticket.com"
baseurl: ""
permalink: /:title/

author:
  name: DismissTicket Team
  url: https://dismissticket.com

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile.lock

include:
  - _headers
  - _redirects

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "california"
    values:
      layout: default
      state: California
      state_code: CA
  - scope:
      path: "texas"
    values:
      layout: default
      state: Texas
      state_code: TX
  - scope:
      path: "florida"
    values:
      layout: default
      state: Florida
      state_code: FL
  - scope:
      path: "new-york"
    values:
      layout: default
      state: New York
      state_code: NY
  - scope:
      path: "georgia"
    values:
      layout: default
      state: Georgia
      state_code: GA
  - scope:
      path: "ohio"
    values:
      layout: default
      state: Ohio
      state_code: OH
  - scope:
      path: "tools"
    values:
      layout: default
